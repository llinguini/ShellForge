name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            args: '--bundles deb'
          - os: macos-latest
            args: '--bundles dmg'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Sync app version from tag
        run: |
          node <<'NODE'
          const fs = require("fs");

          const version = process.env.GITHUB_REF_NAME?.replace(/^v/, "");
          const isValidVersion =
            /^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version ?? "");
          if (!version || !isValidVersion) {
            throw new Error(`Invalid release tag: ${process.env.GITHUB_REF_NAME}`);
          }

          const updateJson = (path, update) => {
            const content = JSON.parse(fs.readFileSync(path, "utf8"));
            update(content);
            fs.writeFileSync(path, `${JSON.stringify(content, null, 2)}\n`);
          };

          const updateText = (path, update) => {
            fs.writeFileSync(path, update(fs.readFileSync(path, "utf8")));
          };

          updateJson("package.json", (json) => {
            json.version = version;
          });
          updateJson("package-lock.json", (json) => {
            json.version = version;
            json.packages[""].version = version;
          });
          updateJson("src-tauri/tauri.conf.json", (json) => {
            json.version = version;
          });
          updateText("src-tauri/Cargo.toml", (text) =>
            text.replace(/^version = ".*"$/m, `version = "${version}"`),
          );
          updateText("src-tauri/Cargo.lock", (text) =>
            text.replace(
              /(\[\[package\]\]\nname = "shellforge"\nversion = ")[^"]+(")/,
              `$1${version}$2`,
            ),
          );
          NODE

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ShellForge ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for details.
          args: ${{ matrix.args }}
