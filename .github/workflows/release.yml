name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            args: '--bundles deb'
          - os: macos-latest
            args: '--bundles dmg'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Sync app version from tag
        run: |
          node <<'NODE'
          const fs = require("fs");

          const version = process.env.GITHUB_REF_NAME?.replace(/^v/, "");
          const isValidVersion =
            /^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version ?? "");
          if (!version || !isValidVersion) {
            throw new Error(`Invalid release tag: ${process.env.GITHUB_REF_NAME}`);
          }

          const updateJson = (path, update) => {
            const content = JSON.parse(fs.readFileSync(path, "utf8"));
            update(content);
            fs.writeFileSync(path, `${JSON.stringify(content, null, 2)}\n`);
          };

          const updateText = (path, update) => {
            fs.writeFileSync(path, update(fs.readFileSync(path, "utf8")));
          };

          updateJson("package.json", (json) => { json.version = version; });
          updateJson("package-lock.json", (json) => {
            json.version = version;
            json.packages[""].version = version;
          });
          updateJson("src-tauri/tauri.conf.json", (json) => { json.version = version; });
          updateText("src-tauri/Cargo.toml", (text) =>
            text.replace(/^version = ".*"$/m, `version = "${version}"`),
          );
          updateText("src-tauri/Cargo.lock", (text) =>
            text.replace(
              /(\[\[package\]\]\nname = "shellforge"\nversion = ")[^"]+(")/,
              `$1${version}$2`,
            ),
          );
          NODE

      - name: Install frontend dependencies
        run: npm ci

      - name: Build daemon (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release --manifest-path src-daemon/Cargo.toml
          mkdir -p src-tauri/binaries
          cp src-daemon/target/release/shellforge-daemon \
             src-tauri/binaries/shellforge-daemon-x86_64-unknown-linux-gnu

      - name: Build daemon (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin \
            --manifest-path src-daemon/Cargo.toml
          cargo build --release --target aarch64-apple-darwin \
            --manifest-path src-daemon/Cargo.toml
          mkdir -p src-tauri/binaries
          DAEMON_AARCH64=src-daemon/target/aarch64-apple-darwin/release/shellforge-daemon
          DAEMON_X86=src-daemon/target/x86_64-apple-darwin/release/shellforge-daemon
          BINARIES=src-tauri/binaries
          lipo -create -output \
            "$BINARIES/shellforge-daemon-universal-apple-darwin" \
            "$DAEMON_X86" \
            "$DAEMON_AARCH64"
          # Tauri resolves externalBin by the build host triple (aarch64 on
          # macos-latest), not only the universal name.
          cp "$DAEMON_AARCH64" "$BINARIES/shellforge-daemon-aarch64-apple-darwin"
          cp "$DAEMON_X86" "$BINARIES/shellforge-daemon-x86_64-apple-darwin"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ShellForge ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for details.
          args: ${{ matrix.args }}
